<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kepemilikan KSEI — Panel Bacaan Bandar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0B1220; --panel: #141C2E; --border: #232C42; --borderHi: #2E3954;
    --text: #EDEAE2; --muted: #8B93A7; --faint: #59627A;
    --gold: #C9A227; --pos: #3FB68B; --neg: #E1615A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 26px 22px 60px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; border-radius: 3px;
    padding: 9px 16px; border: 1px solid var(--border); background: none; color: var(--muted);
    text-decoration: none;
  }
  .btn-gold { background: var(--gold); color: var(--bg); font-weight: 600; border: none; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  .nav { display: flex; gap: 8px; margin-bottom: 20px; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .warn { background: #3A3020; border: 1px solid #5A4A2A; color: #E8C468; border-radius: 4px; padding: 12px 16px; font-size: 12.5px; line-height: 1.6; }
  .warnRed { background: #331E20; border-color: #5A2A2A; color: var(--neg); }
</style>
</head>
<body>
<div id="root"></div>

<script>
const T = { pos: "#3FB68B", neg: "#E1615A", gold: "#C9A227", muted:"#8B93A7", faint:"#59627A" };

let state = {
  rows: [],
  connection: JSON.parse(localStorage.getItem("bdm_connection") || "null"),
  loading: false,
  error: "",
};

function esc(s){ const d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
function numFmt(n){
  const a = Math.round(Math.abs(n));
  return (n<0?"\u2212":"") + a.toLocaleString('id-ID');
}
function pct(n){ return (n>=0?"+":"") + (n*100).toFixed(1) + "%"; }

function sparklineSVG(values, color, w=260, h=40){
  if (values.length < 2) return "";
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v,i) => {
    const x = (i/(values.length-1)) * (w-4) + 2;
    const y = h - 2 - ((v-min)/range) * (h-4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.75"/></svg>`;
}

async function loadData(){
  if(!state.connection){ render(); return; }
  state.loading = true; state.error = ""; render();
  try{
    const c = state.connection;
    const sep = c.url.includes("?") ? "&" : "?";
    const res = await fetch(`${c.url}${sep}token=${encodeURIComponent(c.token)}&sheet=ksei_ownership`);
    const json = await res.json();
    if(json.error){ state.error = json.error; }
    else {
      state.rows = (json.data||[]).map(r => ({
        date: r.date, ticker: r.ticker,
        local_individual: Number(r.local_individual),
        local_institusi_total: Number(r.local_institusi_total),
        foreign_individual: Number(r.foreign_individual),
        foreign_institusi_total: Number(r.foreign_institusi_total),
        total_local: Number(r.total_local),
        total_foreign: Number(r.total_foreign),
      })).filter(r => r.date && r.ticker);
    }
  } catch(e){
    state.error = "Gagal mengambil data. Cek koneksi Apps Script.";
  }
  state.loading = false;
  render();
}

function trendNote(curr, prev){
  if (!prev) return null;
  const indivChange = curr.local_individual - prev.local_individual;
  const instChange = curr.local_institusi_total - prev.local_institusi_total;
  const indivPct = prev.local_individual ? indivChange / Math.abs(prev.local_individual) : 0;

  if (indivChange < 0 && instChange > 0) {
    return { type: "bullish", text: `Individual lokal turun ${pct(indivPct)}, Institusi lokal naik -- pola akumulasi (barang pindah retail ke institusi)` };
  }
  if (indivChange > 0 && instChange < 0) {
    return { type: "bearish", text: `Individual lokal naik ${pct(indivPct)}, Institusi lokal turun -- pola distribusi (barang pindah institusi ke retail)` };
  }
  return { type: "neutral", text: "Belum ada pola jelas perpindahan Individual vs Institusi bulan ini" };
}

const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function buildMonthList(history) {
  const sorted = [...history].sort((a,b) => new Date(a.date) - new Date(b.date));
  if (sorted.length === 0) return [];

  const lastDate = new Date(sorted[sorted.length - 1].date);
  const year = lastDate.getFullYear();
  const lastMonthIdx = lastDate.getMonth();

  const byMonth = {};
  sorted.forEach(r => {
    const d = new Date(r.date);
    if (d.getFullYear() === year) byMonth[d.getMonth()] = r.local_individual;
  });

  const list = [];
  let prevVal = null;
  for (let m = 0; m <= lastMonthIdx; m++) {
    const val = byMonth[m] !== undefined ? byMonth[m] : null;
    let delta = null, arrow = null, color = T.faint;
    if (val !== null && prevVal !== null) {
      delta = val - prevVal;
      if (delta > 0) { arrow = "\u25B2"; color = T.pos; }
      else if (delta < 0) { arrow = "\u25BC"; color = T.neg; }
      else { arrow = "\u2013"; color = T.muted; }
    }
    list.push({ label: `${BULAN_ID[m]} ${year}`, val, delta, arrow, color });
    if (val !== null) prevVal = val;
  }
  return list;
}

function renderMonthList(items) {
  return items.map(item => `
    <div style="padding:14px 0;border-bottom:1px solid var(--border)">
      <div class="mono" style="font-size:12px;color:var(--faint);letter-spacing:0.5px;margin-bottom:6px">${esc(item.label)}</div>
      ${item.val === null ? `
        <div class="mono" style="font-size:15px;color:var(--faint)">Belum ada data</div>
      ` : `
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
          <span class="display" style="font-size:24px;font-weight:700;color:var(--text)">${numFmt(item.val)}</span>
          ${item.arrow ? `<span style="font-size:16px;color:${item.color}">${item.arrow}</span>` : ''}
          ${item.delta !== null ? `<span class="mono" style="font-size:13px;color:${item.color}">${item.delta>0?'+':''}${numFmt(item.delta)}</span>` : ''}
        </div>
      `}
    </div>
  `).join("");
}

function renderTickerCard(ticker, history){
  const monthList = buildMonthList(history);

  return `
  <div class="card" style="padding:20px">
    <div class="display" style="font-size:22px;font-weight:700;margin-bottom:2px">${esc(ticker)}</div>
    <div class="mono" style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">SID / Kepemilikan Individual (Lokal)</div>
    ${monthList.length ? renderMonthList(monthList) : `<div style="color:var(--faint);font-size:13px;padding:16px 0">Belum ada data.</div>`}
  </div>`;
}

function render(){
  const root = document.getElementById("root");

  if(!state.connection){
    root.innerHTML = `
    <div class="wrap">
      <div class="nav"><a href="index.html" class="btn">&larr; Kembali ke Dashboard</a></div>
      <h1 class="display" style="font-size:27px;font-weight:700">Kepemilikan KSEI</h1>
      <div class="card" style="padding:40px 24px;text-align:center;margin-top:20px">
        <div style="font-size:14px;color:var(--muted)">Belum tersambung ke Apps Script. Buka Dashboard utama dan sambungkan dulu di sana.</div>
      </div>
    </div>`;
    return;
  }

  const byTicker = {};
  state.rows.forEach(r => {
    if (!byTicker[r.ticker]) byTicker[r.ticker] = [];
    byTicker[r.ticker].push(r);
  });
  const tickers = Object.keys(byTicker).sort();

  root.innerHTML = `
  <div class="wrap">
    <div class="nav">
      <a href="index.html" class="btn">&larr; Kembali ke Dashboard</a>
      <a href="backtest.html" class="btn">Backtest</a>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px">
      <div>
        <div class="mono" style="font-size:10.5px;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase;margin-bottom:5px">Data bulanan resmi KSEI</div>
        <h1 class="display" style="font-size:27px;font-weight:700;margin:0">Kepemilikan Saham</h1>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px">${state.rows.length} baris data dari ${tickers.length} saham</div>
      </div>
      <button class="btn" onclick="loadData()">${state.loading?'Memuat...':'Refresh'}</button>
    </div>

    ${state.error ? `<div class="warn warnRed" style="margin-bottom:20px">${esc(state.error)}</div>` : ""}
    ${tickers.length === 0 && !state.loading ? `<div class="warn">Belum ada data KSEI tersimpan. Jalankan <span class="mono">runMonthlyKseiSync</span> di Apps Script dulu.</div>` : ""}

    <div class="grid-cards">
      ${tickers.map(t => renderTickerCard(t, byTicker[t])).join("")}
    </div>

    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);line-height:1.6">
      Data dari file resmi publik KSEI (web.ksei.co.id), dipublikasikan bulanan. Ini BUKAN jumlah SID (investor)
      persis, melainkan breakdown kepemilikan saham per kategori investor. "Individual" mewakili kira-kira posisi
      retail; kategori lain (Institusi) mewakili dana pensiun, reksadana, perbankan, korporasi, dll.
    </div>
  </div>`;
}

loadData();
</script>
</body>
</html>
