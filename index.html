<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BDM Index">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Panel Bacaan Bandar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0B1220; --panel: #141C2E; --border: #232C42; --borderHi: #2E3954;
    --text: #EDEAE2; --muted: #8B93A7; --faint: #59627A;
    --gold: #C9A227; --pos: #3FB68B; --neg: #E1615A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 26px 22px 60px; }
  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }
  .sidebar { position: sticky; top: 20px; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; border-radius: 3px;
    padding: 9px 16px; border: 1px solid var(--border); background: none; color: var(--muted);
  }
  .btn-gold { background: var(--gold); color: var(--bg); font-weight: 600; border: none; }
  .btn:hover { border-color: var(--borderHi); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  input, select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    padding: 9px 10px; outline: none; width: 100%;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,8,15,0.78); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box { background: var(--panel); border: 1px solid var(--borderHi); border-radius: 4px; width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 17px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-foot { padding: 13px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.8px;
    border-radius: 2px; padding: 2px 6px; border: 1px solid var(--border); color: var(--muted);
  }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
  .tab { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px 12px; }
  ::placeholder { color: var(--faint); }
  a { color: var(--gold); }

  /* ============================================================
     OPTIMASI MOBILE (< 768px)
     ============================================================ */
  @media (max-width: 767px) {
    body { font-size: 14px; }
    .wrap { padding: 12px !important; }
    .card { padding: 12px !important; }

    /* Toolbar atas: stack vertikal di HP */
    .toolbar-mobile { flex-direction: column; align-items: stretch !important; gap: 8px !important; }
    .toolbar-mobile > * { width: 100%; }
    .toolbar-mobile .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .toolbar-mobile .btn-row .btn { flex: 1 1 auto; min-width: 0; font-size: 12px; padding: 8px 10px; }

    /* Judul saham lebih kecil di HP */
    h1.display { font-size: 20px !important; }

    /* 3 kartu ringkasan: full width, stack */
    .kartu-ringkasan { flex-direction: column !important; }
    .kartu-ringkasan > * { flex: 1 1 100% !important; }

    /* Tab (Ledger/Matriks/Kartu): scroll horizontal kalau kepanjangan */
    .tab-bar { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .tab-bar .btn { display: inline-block; }

    /* Broker Summary side-by-side: stack vertikal di HP */
    .broker-summary-grid { grid-template-columns: 1fr !important; }

    /* Ledger row: kurangi padding kolom */
    .ledger-row { grid-template-columns: 36px 1fr 60px 60px 70px !important; gap: 6px !important; font-size: 11px !important; }
    .ledger-row .broker-name { font-size: 11px !important; }

    /* Sidebar (SID + Fundamental): full width, di bawah main */
    .sidebar-mobile { position: static !important; margin-top: 16px; }

    /* Modal fullscreen di HP */
    .modal-box { max-width: 100% !important; max-height: 100% !important; border-radius: 0 !important; }
    .modal-overlay { padding: 0 !important; }

    /* Hilangkan hover effect (sentuhan) */
    .btn:hover { border-color: var(--border) !important; }

    /* Safe area untuk iPhone dengan notch */
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  }

  /* PWA Install Hint (cuma tampil di iPhone Safari belum-install) */
  .pwa-hint {
    position: fixed;
    bottom: 16px;
    left: 16px;
    right: 16px;
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12.5px;
    color: var(--text);
    z-index: 500;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .pwa-hint.show { display: flex; align-items: center; gap: 10px; }
  .pwa-hint-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
  }

  /* ============================================================
     STYLE KHUSUS UNTUK TABEL IDX (baru)
     ============================================================ */
  #idx-table th { background: #1a2540; padding: 8px 12px; text-align: left; cursor: pointer; font-size: 11px; letter-spacing: 0.5px; color: var(--muted); }
  #idx-table th:hover { background: #253050; }
  #idx-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  #idx-table tr:hover { background: #1a2540; }
  .idx-lf-badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .idx-lf-L { background: #1a3a5c; color: #60a5fa; }
  .idx-lf-F { background: #4a1a3a; color: #f472b6; }
  .idx-lf-unknown { background: #2a2a3a; color: #94a3b8; }
  .idx-pct-high { color: #ef4444; }
  .idx-pct-mid { color: #f59e0b; }
  .idx-pct-low { color: #3b82f6; }

  /* Section IDX - agar menyatu dengan tema */
  .idx-section {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .idx-controls {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .idx-controls input, .idx-controls select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
    color: var(--text); padding: 8px 14px; font-size: 13px; outline: none;
  }
  .idx-controls input { flex: 1; min-width: 150px; }
  .idx-controls select { width: auto; min-width: 120px; }
  .idx-controls button {
    background: var(--gold); color: var(--bg); border: none; border-radius: 20px;
    padding: 8px 18px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .idx-stats {
    font-size: 13px; color: var(--muted); margin-bottom: 12px;
  }
  .idx-stats span { color: var(--text); font-weight: 600; }
  .idx-pagination {
    display: flex; gap: 10px; margin-top: 14px; align-items: center;
  }
  .idx-pagination button {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 6px 14px; cursor: pointer;
  }
  .idx-pagination button:disabled { opacity: 0.4; cursor: default; }
  .idx-pagination span { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ============================================================
// KONSTAN & UTIL
// ============================================================
const BIG = new Set(["AK","BK","CC","NI","II","RF","SQ"]);
const RETAIL = new Set(["XL","PD","AZ","XC","YP","KK","EP"]);
function tipeBroker(code){ if(BIG.has(code)) return "BANDAR"; if(RETAIL.has(code)) return "RITEL"; return "LAIN"; }
function lotFmt(n){
  const a = Math.round(Math.abs(n));
  const s = a.toLocaleString('id-ID');
  return (n>0?"+":n<0?"\u2212":"") + s;
}
function esc(s){ const d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }

const SAMPLE = `date,ticker,broker_code,broker_name,side,lot,value,avg
2026-08-19,MBSS,AK,UBS Sekuritas,BUY,2000,568000000,2840
2026-08-19,MBSS,XL,Stockbit Sekuritas,SELL,900,255600000,2840
2026-08-20,MBSS,AK,UBS Sekuritas,SELL,1000,283000000,2830
2026-08-20,MBSS,XL,Stockbit Sekuritas,SELL,700,198100000,2830`;

// ============================================================
// STATE (persist ke localStorage)
// ============================================================
let state = {
  rows: JSON.parse(localStorage.getItem("bdm_rows") || "[]"),
  connection: JSON.parse(localStorage.getItem("bdm_connection") || "null"),
  ticker: "",
  varian: "ledger",
  syncing: false,
  syncError: "",
  lastSync: localStorage.getItem("bdm_lastsync") || null,
  showUpload: false,
  showConnect: false,
  // --- data SID (kepemilikan individual lokal, dari KSEI) ---
  kseiRows: [],
  kseiLoading: false,
  kseiError: "",
  // --- data fundamental (PER, PBV, ROE, DER, market cap) ---
  fundamentalRows: [],
  fundamentalLoading: false,
  fundamentalError: "",
  // --- tanggal yang dipilih untuk broker summary (default: null = hari terakhir) ---
  brokerSummaryDate: null,
  // --- mode ledger: "akumulasi" (all-days net) atau "agresif" (hari terakhir saja) ---
  ledgerMode: "akumulasi",
  // --- data IDX Shareholder (baru) ---
  idxData: [],
  idxFiltered: [],
  idxPage: 0,
  idxLoading: false,
  idxError: "",
  idxSortField: "PERCENTAGE",
  idxSortAsc: false,
  idxSearch: "",
  idxFilterKode: "",
};

const IDX_PAGE_SIZE = 50;

function saveRows(rows){
  state.rows = rows;
  localStorage.setItem("bdm_rows", JSON.stringify(rows));
}
function saveConnection(conn){
  state.connection = conn;
  localStorage.setItem("bdm_connection", JSON.stringify(conn));
}
function mergeIncoming(incoming){
  const key = r => `${r.date}__${r.ticker}__${r.broker_code}__${r.side}`;
  const map = new Map(state.rows.map(r => [key(r), r]));
  incoming.forEach(r => map.set(key(r), r));
  return Array.from(map.values());
}

// ============================================================
// SYNC OTOMATIS via Apps Script bridge
// ============================================================
async function syncNow(){
  if(!state.connection) return;
  state.syncing = true; state.syncError = ""; render();
  try{
    const sep = state.connection.url.includes("?") ? "&" : "?";
    const res = await fetch(`${state.connection.url}${sep}token=${encodeURIComponent(state.connection.token)}&sheet=broker_positions`);
    const json = await res.json();
    if(json.error){ state.syncError = json.error; }
    else {
      saveRows(mergeIncoming(json.data || []));
      state.lastSync = new Date().toLocaleTimeString("id-ID");
      localStorage.setItem("bdm_lastsync", state.lastSync);
    }
  } catch(e){
    state.syncError = "Gagal sinkron. Cek URL/token, atau situs Apps Script sedang bermasalah.";
  }
  state.syncing = false;
  render();
}

async function testAndSaveConnection(url, token){
  const sep = url.includes("?") ? "&" : "?";
  const res = await fetch(`${url}${sep}token=${encodeURIComponent(token)}&sheet=broker_positions`);
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  saveConnection({url, token});
  saveRows(mergeIncoming(json.data || []));
  state.lastSync = new Date().toLocaleTimeString("id-ID");
  localStorage.setItem("bdm_lastsync", state.lastSync);
}

// ============================================================
// DATA SID / KEPEMILIKAN KSEI
// ============================================================
const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function numFmtSid(n){
  const a = Math.round(Math.abs(n));
  return (n<0?"\u2212":"") + a.toLocaleString('id-ID');
}

async function loadKseiData(){
  if(!state.connection) return;
  state.kseiLoading = true; state.kseiError = ""; render();
  try{
    const c = state.connection;
    const sep = c.url.includes("?") ? "&" : "?";
    const res = await fetch(`${c.url}${sep}token=${encodeURIComponent(c.token)}&sheet=ksei_ownership`);
    const json = await res.json();
    if(json.error){ state.kseiError = json.error; }
    else {
      state.kseiRows = (json.data||[]).map(r => ({
        date: r.date,
        ticker: r.ticker,
        local_individual: Number(r.local_individual),
      })).filter(r => r.date && r.ticker);
    }
  } catch(e){
    state.kseiError = "Gagal mengambil data SID.";
  }
  state.kseiLoading = false;
  render();
}

function buildMonthList(history) {
  const sorted = [...history].sort((a,b) => new Date(a.date) - new Date(b.date));
  if (sorted.length === 0) return [];

  const lastDate = new Date(sorted[sorted.length - 1].date);
  const year = lastDate.getFullYear();
  const lastMonthIdx = lastDate.getMonth();

  const byMonth = {};
  sorted.forEach(r => {
    const d = new Date(r.date);
    if (d.getFullYear() === year) byMonth[d.getMonth()] = r.local_individual;
  });

  const list = [];
  let prevVal = null;
  for (let m = 0; m <= lastMonthIdx; m++) {
    const val = byMonth[m] !== undefined ? byMonth[m] : null;
    let delta = null, arrow = null, color = "var(--faint)";
    if (val !== null && prevVal !== null) {
      delta = val - prevVal;
      if (delta > 0) { arrow = "\u25B2"; color = "var(--pos)"; }
      else if (delta < 0) { arrow = "\u25BC"; color = "var(--neg)"; }
      else { arrow = "\u2013"; color = "var(--muted)"; }
    }
    list.push({ label: `${BULAN_ID[m]} ${year}`, val, delta, arrow, color });
    if (val !== null) prevVal = val;
  }
  return list;
}

function renderMonthList(items) {
  return items.map(item => `
    <div style="padding:7px 0;border-bottom:1px solid var(--border)">
      <div class="mono" style="font-size:10px;color:var(--faint);letter-spacing:0.5px;margin-bottom:2px">${esc(item.label)}</div>
      ${item.val === null ? `
        <div class="mono" style="font-size:11px;color:var(--faint)">Belum ada data</div>
      ` : `
        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
          <span class="display" style="font-size:13px;font-weight:700;color:var(--text)">${numFmtSid(item.val)}</span>
          ${item.arrow ? `<span style="font-size:10px;color:${item.color}">${item.arrow}</span>` : ''}
          ${item.delta !== null ? `<span class="mono" style="font-size:10px;color:${item.color}">${item.delta>0?'+':''}${numFmtSid(item.delta)}</span>` : ''}
        </div>
      `}
    </div>
  `).join("");
}

function renderSidCard(activeTicker){
  if(!state.connection){
    return `
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div class="mono" style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">SID / Kepemilikan Individual (Lokal)</div>
      <div style="font-size:11px;color:var(--muted)">Sambungkan otomatis dulu untuk melihat data SID.</div>
    </div>`;
  }
  const history = state.kseiRows.filter(r => r.ticker === activeTicker);
  const monthList = buildMonthList(history);
  return `
  <div class="card" style="padding:12px;margin-bottom:12px">
    <div class="display" style="font-size:13px;font-weight:700;margin-bottom:1px">${esc(activeTicker || "-")}</div>
    <div class="mono" style="font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">SID / Kepemilikan Individual (Lokal)</div>
    ${state.kseiLoading ? `<div style="color:var(--faint);font-size:11px;padding:8px 0">Memuat data SID...</div>` :
      state.kseiError ? `<div style="color:var(--neg);font-size:11px;padding:8px 0">${esc(state.kseiError)}</div>` :
      monthList.length ? renderMonthList(monthList) : `<div style="color:var(--faint);font-size:11px;padding:8px 0">Belum ada data SID untuk ${esc(activeTicker || "saham ini")}.</div>`}
  </div>`;
}

// ============================================================
// DATA FUNDAMENTAL
// ============================================================
async function loadFundamentalData(){
  if(!state.connection) return;
  state.fundamentalLoading = true; state.fundamentalError = ""; render();
  try{
    const c = state.connection;
    const sep = c.url.includes("?") ? "&" : "?";
    const res = await fetch(`${c.url}${sep}token=${encodeURIComponent(c.token)}&sheet=fundamental_data`);
    const json = await res.json();
    if(json.error){ state.fundamentalError = json.error; }
    else {
      state.fundamentalRows = (json.data||[]).map(r => ({
        date: r.date,
        ticker: r.ticker,
        market_cap: Number(r.market_cap),
        per: Number(r.per),
        pbv: Number(r.pbv),
        roe: Number(r.roe),
        der: Number(r.der),
      })).filter(r => r.ticker);
    }
  } catch(e){
    state.fundamentalError = "Gagal mengambil data fundamental.";
  }
  state.fundamentalLoading = false;
  render();
}

function getFundamentalForTicker(ticker){
  if(!ticker || !state.fundamentalRows.length) return null;
  const rows = state.fundamentalRows.filter(r => r.ticker === ticker);
  if(!rows.length) return null;
  rows.sort((a,b) => new Date(b.date) - new Date(a.date));
  return rows[0];
}

function renderFundamentalCard(activeTicker){
  if(!state.connection) return "";
  const data = getFundamentalForTicker(activeTicker);
  return `
  <div class="card" style="padding:20px;margin-bottom:20px">
    <div class="mono" style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">Fundamental Data</div>
    ${state.fundamentalLoading ? `<div style="color:var(--faint);font-size:13px;padding:8px 0">Memuat...</div>` :
      state.fundamentalError ? `<div style="color:var(--neg);font-size:13px;padding:8px 0">${esc(state.fundamentalError)}</div>` :
      !data ? `<div style="color:var(--faint);font-size:13px;padding:8px 0">Data tidak tersedia untuk ${esc(activeTicker || "saham ini")}.</div>` :
      `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px">
          <span style="color:var(--muted)">PER</span>
          <span class="mono" style="font-weight:600">${data.per.toFixed(2)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px">
          <span style="color:var(--muted)">PBV</span>
          <span class="mono" style="font-weight:600">${data.pbv.toFixed(2)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px">
          <span style="color:var(--muted)">ROE %</span>
          <span class="mono" style="font-weight:600">${data.roe.toFixed(2)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px">
          <span style="color:var(--muted)">DER</span>
          <span class="mono" style="font-weight:600">${data.der.toFixed(2)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px">
          <span style="color:var(--muted)">Mkt Cap</span>
          <span class="mono" style="font-weight:600">${(data.market_cap/1e12).toFixed(2)}T</span>
        </div>
      `}
  </div>`;
}

// ============================================================
// DATA IDX SHAREHOLDER (BARU)
// ============================================================
const IDX_API_URL = 'https://script.google.com/macros/s/ABCDE12345/exec'; // <-- GANTI INI

async function loadIdxData(){
  state.idxLoading = true; state.idxError = ""; render();
  try {
    const resp = await fetch(`${IDX_API_URL}?limit=9999`);
    const json = await resp.json();
    if (!json.success) throw new Error(json.error || "Gagal mengambil data IDX");
    state.idxData = json.data || [];
    // Isi dropdown filter kode
    const kodeSet = new Set(state.idxData.map(d => d.SHARE_CODE).filter(Boolean));
    const filterSelect = document.getElementById('idx-filter-kode');
    if (filterSelect) {
      filterSelect.innerHTML = '<option value="">Semua Saham</option>';
      [...kodeSet].sort().forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = k;
        filterSelect.appendChild(opt);
      });
    }
    applyIdxFilter();
  } catch (err) {
    state.idxError = err.message;
    render();
  }
  state.idxLoading = false;
  render();
}

function applyIdxFilter(){
  const kata = state.idxSearch.toLowerCase().trim();
  const kode = state.idxFilterKode;
  state.idxFiltered = state.idxData.filter(d => {
    if (kode && d.SHARE_CODE !== kode) return false;
    if (kata) {
      const cocok = (d.ISSUER_NAME || '').toLowerCase().includes(kata) ||
                    (d.INVESTOR_NAME || '').toLowerCase().includes(kata) ||
                    (d.SHARE_CODE || '').toLowerCase().includes(kata);
      if (!cocok) return false;
    }
    return true;
  });
  // Sort
  state.idxFiltered.sort((a, b) => {
    let va = a[state.idxSortField] ?? '', vb = b[state.idxSortField] ?? '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return state.idxSortAsc ? -1 : 1;
    if (va > vb) return state.idxSortAsc ? 1 : -1;
    return 0;
  });
  state.idxPage = 0;
  renderIdxTable();
  updateIdxPagination();
}

function renderIdxTable(){
  const tbody = document.getElementById('idx-tbody');
  if (!tbody) return;
  const start = state.idxPage * IDX_PAGE_SIZE;
  const pageData = state.idxFiltered.slice(start, start + IDX_PAGE_SIZE);
  if (state.idxLoading) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">⏳ Memuat data IDX...</td></tr>';
    return;
  }
  if (state.idxError) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--neg)">❌ ${esc(state.idxError)}</td></tr>`;
    return;
  }
  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">Tidak ada data</td></tr>';
    return;
  }
  tbody.innerHTML = pageData.map(d => {
    const lfClass = d.LOCAL_FOREIGN === 'L' ? 'idx-lf-L' : d.LOCAL_FOREIGN === 'F' ? 'idx-lf-F' : 'idx-lf-unknown';
    const pct = d.PERCENTAGE || 0;
    const pctClass = pct > 10 ? 'idx-pct-high' : pct > 5 ? 'idx-pct-mid' : 'idx-pct-low';
    return `
      <tr>
        <td style="font-weight:600;">${esc(d.SHARE_CODE || '-')}</td>
        <td>${esc(d.ISSUER_NAME || '-')}</td>
        <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${esc(d.INVESTOR_NAME || '')}">${esc(d.INVESTOR_NAME || '-')}</td>
        <td>${esc(d.INVESTOR_CLASSIFICATION || '-')}</td>
        <td><span class="idx-lf-badge ${lfClass}">${esc(d.LOCAL_FOREIGN || '-')}</span></td>
        <td style="text-align:right;font-family:monospace;">${d.TOTAL_HOLDING_SHARES ? Number(d.TOTAL_HOLDING_SHARES).toLocaleString('id-ID') : '-'}</td>
        <td style="text-align:right;font-weight:600;class="${pctClass}">${d.PERCENTAGE ? d.PERCENTAGE.toFixed(2) + '%' : '-'}</td>
      </tr>
    `;
  }).join('');
}

function updateIdxPagination(){
  const total = state.idxFiltered.length;
  const totalPages = Math.ceil(total / IDX_PAGE_SIZE) || 1;
  const pageInfo = document.getElementById('idx-page-info');
  const prevBtn = document.getElementById('idx-prev');
  const nextBtn = document.getElementById('idx-next');
  const stats = document.getElementById('idx-stats-text');
  if (pageInfo) pageInfo.textContent = `Halaman ${state.idxPage+1} dari ${totalPages}`;
  if (prevBtn) prevBtn.disabled = state.idxPage === 0;
  if (nextBtn) nextBtn.disabled = state.idxPage >= totalPages - 1;
  if (stats) {
    const uniqueCodes = new Set(state.idxData.map(d => d.SHARE_CODE).filter(Boolean));
    const uniqueInvestors = new Set(state.idxData.map(d => d.INVESTOR_NAME).filter(Boolean));
    stats.innerHTML = `Total data: <span>${state.idxData.length}</span> | Saham unik: <span>${uniqueCodes.size}</span> | Investor unik: <span>${uniqueInvestors.size}</span>`;
  }
}
