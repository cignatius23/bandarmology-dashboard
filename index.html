<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Bacaan Bandar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0B1220; --panel: #141C2E; --border: #232C42; --borderHi: #2E3954;
    --text: #EDEAE2; --muted: #8B93A7; --faint: #59627A;
    --gold: #C9A227; --pos: #3FB68B; --neg: #E1615A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 26px 22px 60px; }
  .layout { display: grid; grid-template-columns: 1fr 260px; gap: 18px; align-items: start; }
  .sidebar { position: sticky; top: 20px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; border-radius: 3px;
    padding: 9px 16px; border: 1px solid var(--border); background: none; color: var(--muted);
  }
  .btn-gold { background: var(--gold); color: var(--bg); font-weight: 600; border: none; }
  .btn:hover { border-color: var(--borderHi); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  input, select, textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    padding: 9px 10px; outline: none; width: 100%;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,8,15,0.78); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box { background: var(--panel); border: 1px solid var(--borderHi); border-radius: 4px; width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 17px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-foot { padding: 13px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.8px;
    border-radius: 2px; padding: 2px 6px; border: 1px solid var(--border); color: var(--muted);
  }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
  .tab { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px 12px; }
  ::placeholder { color: var(--faint); }
  a { color: var(--gold); }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ============================================================
// KONSTAN & UTIL
// ============================================================
const BIG = new Set(["AK","BK","CC","NI","II","RF","SQ"]);
const RETAIL = new Set(["XL","PD","AZ","XC","YP","KK","EP"]);
function tipeBroker(code){ if(BIG.has(code)) return "BANDAR"; if(RETAIL.has(code)) return "RITEL"; return "LAIN"; }
function lotFmt(n){
  const a = Math.round(Math.abs(n));
  const s = a.toLocaleString('id-ID');
  return (n>0?"+":n<0?"−":"") + s;
}
function esc(s){ const d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }

// ============================================================
// STATE
// ============================================================
let state = {
  rows: JSON.parse(localStorage.getItem("bdm_rows") || "[]"),
  connection: JSON.parse(localStorage.getItem("bdm_connection") || "null"),
  ticker: "",
  varian: "ledger",
  syncing: false,
  syncError: "",
  lastSync: localStorage.getItem("bdm_lastsync") || null,
  showUpload: false,
  showConnect: false,
  kseiRows: [],
  kseiLoading: false,
  kseiError: ""
};

// ============================================================
// KSEI DATA LOADER
// ============================================================
async function loadKseiData(){
  if(!state.connection) return;
  state.kseiLoading = true;
  state.kseiError = "";
  try {
    const res = await fetch(state.connection.url + "?sheet=ksei_ownership", {
      headers: { Authorization: `Bearer ${state.connection.token}` }
    });
    if(!res.ok) throw new Error(`KSEI load error ${res.status}`);
    const json = await res.json();
    const sheet = json.values || [];
    const header = (sheet[0] || []).map(h => h.toLowerCase());
    state.kseiRows = sheet.slice(1).map(row => {
      const obj = {};
      header.forEach((h, i) => { obj[h] = row[i] || ""; });
      return obj;
    });
  } catch(e) {
    state.kseiError = e.message;
  } finally {
    state.kseiLoading = false;
  }
}

// ============================================================
// APPS SCRIPT CONNECTION
// ============================================================
async function connect(){
  const urlInput = document.getElementById("connUrl");
  const tokenInput = document.getElementById("connToken");
  const url = (urlInput?.value || "").trim();
  const token = (tokenInput?.value || "").trim();
  
  if(!url || !token) { alert("Isi URL dan token"); return; }
  
  state.syncing = true;
  render();
  
  try {
    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if(!res.ok) throw new Error(`Connection failed: ${res.status}`);
    const json = await res.json();
    
    state.connection = { url, token };
    state.syncError = "";
    localStorage.setItem("bdm_connection", JSON.stringify(state.connection));
    
    await loadBrokerData();
    await loadKseiData();
    
    state.showConnect = false;
  } catch(e) {
    state.syncError = e.message;
  } finally {
    state.syncing = false;
    render();
  }
}

async function loadBrokerData(){
  if(!state.connection) return;
  state.syncing = true;
  try {
    const res = await fetch(state.connection.url, {
      headers: { Authorization: `Bearer ${state.connection.token}` }
    });
    const json = await res.json();
    const sheet = json.values || [];
    const header = (sheet[0] || []).map(h => h.toLowerCase());
    state.rows = sheet.slice(1).map(row => {
      const obj = {};
      header.forEach((h, i) => { obj[h] = row[i] || ""; });
      return obj;
    });
    localStorage.setItem("bdm_rows", JSON.stringify(state.rows));
    state.lastSync = new Date().toLocaleString('id-ID');
    localStorage.setItem("bdm_lastsync", state.lastSync);
  } catch(e) {
    state.syncError = e.message;
  } finally {
    state.syncing = false;
  }
}

// ============================================================
// RENDER
// ============================================================
function render(){
  const root = document.getElementById("root");
  root.innerHTML = `
    <div class="wrap">
      <div class="layout">
        <div id="main"></div>
        <div class="sidebar">
          ${renderTickerSelector()}
          ${renderSidCard()}
        </div>
      </div>
    </div>
    ${state.showConnect ? renderConnectModal() : ""}
    ${state.showUpload ? renderUploadModal() : ""}
  `;
  
  document.getElementById("connBtn")?.addEventListener("click", () => { state.showConnect = true; render(); });
  document.getElementById("uploadBtn")?.addEventListener("click", () => { state.showUpload = true; render(); });
  document.getElementById("syncBtn")?.addEventListener("click", loadBrokerData);
  document.getElementById("connSubmit")?.addEventListener("click", connect);
  document.getElementById("closeConn")?.addEventListener("click", () => { state.showConnect = false; render(); });
  document.getElementById("closeUpload")?.addEventListener("click", () => { state.showUpload = false; render(); });
  
  document.getElementById("tickerSelect")?.addEventListener("change", (e) => {
    state.ticker = e.target.value;
    render();
  });
  
  renderMain();
}

function renderTickerSelector(){
  const tickers = [...new Set(state.rows.map(r => r.ticker || "").filter(Boolean))].sort();
  const opts = `<option value="">-- Semua Saham --</option>` + tickers.map(t => 
    `<option value="${t}" ${state.ticker === t ? "selected" : ""}>${t}</option>`
  ).join("");
  
  return `
    <div class="card" style="padding: 16px; margin-bottom: 14px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 9px;">Pilih Saham</div>
      <select id="tickerSelect">${opts}</select>
    </div>
  `;
}

function renderSidCard(){
  if(!state.ticker || state.kseiRows.length === 0) return "";
  
  const data = state.kseiRows.filter(r => r.ticker === state.ticker).sort((a,b) => {
    const da = new Date(a.date || "");
    const db = new Date(b.date || "");
    return db - da;
  }).slice(0, 6);
  
  if(data.length === 0) return "";
  
  let html = `
    <div class="card" style="padding: 16px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px;">Kepemilikan Saham (SID)</div>
  `;
  
  data.forEach((row, idx) => {
    const d = row.date ? new Date(row.date).toLocaleDateString('id-ID', {month: 'short', day: 'numeric'}) : "";
    const curr = parseInt(row.local_individual) || 0;
    const prev = data[idx + 1];
    const prevVal = prev ? parseInt(prev.local_individual) || 0 : curr;
    const delta = curr - prevVal;
    const dir = delta > 0 ? "+" : delta < 0 ? "−" : "→";
    const col = delta > 0 ? "var(--pos)" : delta < 0 ? "var(--neg)" : "var(--muted)";
    
    html += `
      <div style="margin-bottom: 10px; font-size: 11px;">
        <div style="color: var(--muted); margin-bottom: 2px;">${d}</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--text);">${curr.toLocaleString('id-ID')}</div>
        <div style="color: ${col}; font-size: 10px; margin-top: 2px;">${dir} ${Math.abs(delta).toLocaleString('id-ID')}</div>
      </div>
    `;
  });
  
  html += `</div>`;
  return html;
}

function renderMain(){
  const main = document.getElementById("main");
  if(!state.connection) {
    main.innerHTML = `
      <div class="card" style="padding: 40px; text-align: center;">
        <div style="margin-bottom: 20px; font-size: 14px;">Belum terhubung ke Google Sheets</div>
        <button id="connBtn" class="btn btn-gold">Sambungkan Akun</button>
      </div>
    `;
    return;
  }
  
  const filtered = state.ticker 
    ? state.rows.filter(r => r.ticker === state.ticker)
    : state.rows;
  
  if(filtered.length === 0) {
    main.innerHTML = `<div class="card" style="padding: 20px; text-align: center;">Tidak ada data</div>`;
    return;
  }
  
  let html = `<table class="card"><tr style="border-bottom: 1px solid var(--border);">
    <th style="text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;">Date</th>
    <th style="text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;">Ticker</th>
    <th style="text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;">Broker</th>
    <th style="text-align: right; color: var(--muted); font-weight: 600; font-size: 11px;">Lot</th>
    <th style="text-align: right; color: var(--muted); font-weight: 600; font-size: 11px;">Value (M)</th>
  </tr>`;
  
  filtered.forEach(r => {
    const lot = parseInt(r.lot) || 0;
    const val = parseInt(r.value) || 0;
    const valM = (val / 1e6).toFixed(0);
    const tipeBrk = tipeBroker(r.broker_code || "");
    const color = tipeBrk === "BANDAR" ? "var(--gold)" : tipeBrk === "RITEL" ? "var(--pos)" : "var(--muted)";
    const side = r.side === "BUY" ? "+" : "−";
    const sideCol = r.side === "BUY" ? "var(--pos)" : "var(--neg)";
    
    html += `<tr style="border-bottom: 1px solid var(--border); font-size: 12px;">
      <td>${esc(r.date)}</td>
      <td><strong>${esc(r.ticker)}</strong></td>
      <td><span style="color: ${color}; font-weight: 600;">${esc(r.broker_code)}</span></td>
      <td style="text-align: right; color: ${sideCol}; font-family: 'IBM Plex Mono', monospace;">${side}${lot.toLocaleString('id-ID')}</td>
      <td style="text-align: right; font-family: 'IBM Plex Mono', monospace;">${valM}</td>
    </tr>`;
  });
  
  html += `</table>`;
  main.innerHTML = html;
}

function renderConnectModal(){
  return `
    <div class="modal-overlay" onclick="if(event.target === this) { state.showConnect = false; render(); }">
      <div class="modal-box">
        <div class="modal-head">
          <h2 style="margin: 0; font-size: 16px;">Sambungkan Apps Script</h2>
          <button id="closeConn" class="btn" style="border: none; background: none; padding: 0; color: var(--muted);">✕</button>
        </div>
        <div class="modal-body">
          <div style="margin-bottom: 16px;">
            <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px;">URL Apps Script</label>
            <input id="connUrl" type="text" placeholder="https://script.google.com/..." value="${state.connection?.url || ""}">
          </div>
          <div style="margin-bottom: 16px;">
            <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px;">Bearer Token</label>
            <input id="connToken" type="password" placeholder="Paste token dari Apps Script" value="${state.connection?.token || ""}">
          </div>
          ${state.syncError ? `<div style="background: rgba(225,97,90,0.1); border: 1px solid var(--neg); border-radius: 3px; padding: 10px; font-size: 12px; color: var(--neg); margin-bottom: 16px;">${esc(state.syncError)}</div>` : ""}
        </div>
        <div class="modal-foot">
          <button id="connSubmit" class="btn btn-gold" ${state.syncing ? "disabled" : ""}>
            ${state.syncing ? "Menghubungkan..." : "Sambungkan"}
          </button>
        </div>
      </div>
    </div>
  `;
}

function renderUploadModal(){
  return `
    <div class="modal-overlay" onclick="if(event.target === this) { state.showUpload = false; render(); }">
      <div class="modal-box">
        <div class="modal-head">
          <h2 style="margin: 0; font-size: 16px;">Upload CSV</h2>
          <button id="closeUpload" class="btn" style="border: none; background: none; padding: 0; color: var(--muted);">✕</button>
        </div>
        <div class="modal-body">
          <div style="background: var(--bg); border: 2px dashed var(--border); border-radius: 3px; padding: 20px; text-align: center; color: var(--muted); font-size: 12px;">
            <input type="file" id="csvFile" accept=".csv" style="display: none;">
            <button class="btn btn-gold" onclick="document.getElementById('csvFile').click();">Pilih File CSV</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// INIT
// ============================================================
if(state.connection) {
  loadBrokerData().then(() => {
    loadKseiData().then(() => render());
  });
} else {
  render();
}

// Auto-sync setiap 2 menit
setInterval(() => {
  if(state.connection && !state.syncing) {
    loadBrokerData().then(() => {
      loadKseiData().then(() => render());
    });
  }
}, 120000);
</script>
</body>
</html>
